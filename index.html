<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ledgerly — a demo billing & invoicing SaaS dashboard built with React, TypeScript and Tailwind CSS." />
    <title>Ledgerly — Billing dashboard demo</title>
    <script>
      // Apply theme before paint to avoid a flash of the wrong theme
      try {
        const s = JSON.parse(localStorage.getItem('ledgerly-app') || '{}').state || {}
        const t = s.theme || 'system'
        const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
